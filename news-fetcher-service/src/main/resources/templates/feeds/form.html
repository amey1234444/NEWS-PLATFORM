<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${feed.id} != null ? 'Edit Feed' : 'New Feed'">Feed</title>
</head>
<body>
<h1 th:text="${feed.id} != null ? 'Edit Feed' : 'New Feed'"></h1>
<form th:action="@{/admin/feeds}" th:object="${feed}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div>
        <label>URL: <input type="text" th:field="*{url}" size="80"/></label>
    </div>
    <div>
        <label>Active: <input type="checkbox" th:field="*{active}"/></label>
    </div>
    <div>
        <label>Polling interval (s): <input type="number" th:field="*{pollingIntervalSeconds}"/></label>
    </div>
    <div>
        <button type="submit">Save</button>
        <a th:href="@{/admin/feeds}">Cancel</a>
    </div>
</form>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Feeds</title>
    <style>table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}</style>
</head>
<body>
<h1>Feeds</h1>
<div th:if="${message}"><strong th:text="${message}"></strong></div>
<p><a th:href="@{/admin/feeds/new}">New Feed</a></p>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>URL</th>
        <th>Active</th>
        <th>Polling (s)</th>
        <th>Next attempt</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="feed : ${feeds}">
        <td th:text="${feed.id}"></td>
        <td th:text="${feed.url}"></td>
        <td th:text="${feed.active}"></td>
        <td th:text="${feed.pollingIntervalSeconds}"></td>
        <td th:text="${feed.nextAttemptAt}"></td>
        <td>
            <a th:href="@{|/admin/feeds/${feed.id}/edit|}">Edit</a>
            <form th:action="@{|/admin/feeds/${feed.id}/delete|}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
            <form th:action="@{|/admin/feeds/${feed.id}/run|}" method="post" style="display:inline">
                <button type="submit">Run</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
